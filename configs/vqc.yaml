model_type: "vqc"
batch_size: 256
learning_rate: 0.001
epochs: 100
embedding_qubits: 9

emulation_set: "swap"
backend: "AER"
noise: false
aer_dev: "GPU"

text:
  ansatz: "custom_v5"
  n: 1
  s: 1
  p: 1
  layers: 2
  curry: true

vision:
  layers: 5
  method: 'amp' # 'amp' or 'pca' or 'mlp'

test_task: "evaluate_text_choice"

dataset:
  name: "aro"
  labels: ["image", "pos_caption", "neg_caption"]
  class: "modules.data_pipeline.datasets.ARODataset"
  collate_fn: "modules.data_pipeline.datasets.aro_collate_fn"
  eval_mapper: "modules.models.fusion.engine.aro_mapper"
  eval_tasks: 
    - "evaluate_text_choice"
    - "compositional_diagnostic"

splits:
  train:
    text_path: "data/aro/processed/train.pkl"
    img_path: "data/aro/processed/image_embeddings.pt"
  val:
    text_path: "data/aro/processed/val.pkl"
    img_path: "data/aro/processed/image_embeddings.pt"
  test_att:
    text_path: "data/aro/processed/test_att.pkl"
    img_path: "data/aro/processed/image_embeddings.pt"
  test_rel:
    text_path: "data/aro/processed/test_rel.pkl"
    img_path: "data/aro/processed/image_embeddings.pt"

